[package]
name = "ic-webdav-fs"
version = "0.1.0"
edition = "2021"
description = "WebDAV connections for Ice Commander: the connection form and the filesystem behind it"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-plugin-api = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { workspace = true }
chrono = "0.4"

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["export-abi"]
export-abi = []
